<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바로가기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 50%, #f5f7fa 100%);
  }
  .container {
    width: 100%;
    max-width: 640px;
    padding: 40px 24px;
  }
  .title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #2d2d2d;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #7a7a7a;
    margin-bottom: 36px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 32px 16px;
    border-radius: 20px;
    text-decoration: none;
    background: #ffffff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.12);
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
  }
  .google::before { background: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853); }
  .youtube::before { background: #FF0000; }
  .naver::before { background: #03C75A; }
  .daum::before { background: #3C1E1E; }

  .icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
  }
  .google .icon { background: #fff; border: 2px solid #eee; color: transparent; font-size: 0; position: relative; }
  .google .icon svg { width: 30px; height: 30px; }
  .youtube .icon { background: #FF0000; }
  .naver .icon { background: #03C75A; }
  .daum .icon { background: #3C1E1E; }

  .label {
    font-size: 16px;
    font-weight: 600;
    color: #333;
  }
  .desc {
    font-size: 12px;
    color: #999;
    margin-top: -8px;
  }

  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
    .title { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title">🔖 나만의 바로가기</div>
    <div class="subtitle">자주 쓰는 사이트를 한눈에</div>
    <div class="grid">
      <a class="card google" href="https://www.google.com" target="_blank" rel="noopener">
        <div class="icon">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.3C29.6 35 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.3C39.9 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        </div>
        <div class="label">Google</div>
        <div class="desc">검색</div>
      </a>

      <a class="card youtube" href="https://www.youtube.com" target="_blank" rel="noopener">
        <div class="icon">▶</div>
        <div class="label">YouTube</div>
        <div class="desc">동영상</div>
      </a>

      <a class="card naver" href="https://www.naver.com" target="_blank" rel="noopener">
        <div class="icon">N</div>
        <div class="label">NAVER</div>
        <div class="desc">포털</div>
      </a>

      <a class="card daum" href="https://www.daum.net" target="_blank" rel="noopener">
        <div class="icon">D</div>
        <div class="label">Daum</div>
        <div class="desc">포털</div>
      </a>
    </div>
  </div>
</body>
</html>
